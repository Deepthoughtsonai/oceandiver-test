<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Shark</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06324f; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<script>
const canvas = document.getElementById("sea");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Where the shark is, which way it faces, and where it wants to go.
const shark = { x: canvas.width / 2, y: canvas.height / 2, angle: 0 };
const target = { x: shark.x, y: shark.y };
const bubbles = [];

function aim(e) {
  target.x = e.clientX;
  target.y = e.clientY;
}
window.addEventListener("pointermove", aim);
window.addEventListener("pointerdown", aim);

function drawShark() {
  ctx.save();
  ctx.translate(shark.x, shark.y);
  ctx.rotate(shark.angle);
  // Keep the shark right-side up when swimming left.
  if (Math.abs(shark.angle) > Math.PI / 2) ctx.scale(1, -1);

  ctx.fillStyle = "#7d95a8";
  // tail
  ctx.beginPath();
  ctx.moveTo(-40, 0); ctx.lineTo(-70, -22); ctx.lineTo(-62, 0); ctx.lineTo(-70, 22);
  ctx.closePath(); ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(0, 0, 50, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  // fin on top
  ctx.beginPath();
  ctx.moveTo(-8, -18); ctx.lineTo(8, -40); ctx.lineTo(18, -18);
  ctx.closePath(); ctx.fill();
  // belly
  ctx.fillStyle = "#e8f0f5";
  ctx.beginPath();
  ctx.ellipse(6, 9, 38, 11, 0, 0, Math.PI);
  ctx.fill();
  // eye
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(30, -6, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Little fish: a few Nemo-style clownfish plus other kinds.
const kinds = ["nemo", "nemo", "nemo", "tang", "tang", "yellow", "yellow", "green"];
const fishes = [];
for (let i = 0; i < 16; i++) {
  fishes.push({
    kind: kinds[i % kinds.length],
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5),
    size: 0.7 + Math.random() * 0.5,
    heading: Math.random() * Math.PI * 2
  });
}

function drawFish(f) {
  const dir = f.vx >= 0 ? 1 : -1;
  const wiggle = Math.sin(performance.now() / 120 + f.heading * 10) * 4;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(dir * f.size, f.size);
  ctx.rotate(Math.max(-0.5, Math.min(0.5, f.vy * 0.15)) * dir);

  const body = { nemo: "#ff7a1a", tang: "#2a5bd7", yellow: "#ffd23a", green: "#4cc38a" }[f.kind];
  const tail = f.kind === "tang" ? "#ffd23a" : body;

  // tail
  ctx.fillStyle = tail;
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(-26, -9 + wiggle); ctx.lineTo(-26, 9 + wiggle);
  ctx.closePath(); ctx.fill();
  if (f.kind === "nemo") {
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // top fin
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-6, -9); ctx.lineTo(2, -17); ctx.lineTo(10, -9);
  ctx.closePath(); ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  if (f.kind === "nemo") {
    // white stripes with dark edges, kept inside the body
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2); ctx.clip();
    for (const sx of [-7, 7]) {
      ctx.fillStyle = "#111"; ctx.fillRect(sx - 4, -12, 8, 24);
      ctx.fillStyle = "#fff"; ctx.fillRect(sx - 2.5, -12, 5, 24);
    }
    ctx.restore();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (f.kind === "tang") {
    ctx.strokeStyle = "#0a1a55"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(4, -6, 14, 2); ctx.stroke();
  }
  // eye
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(11, -3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(12, -3, 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function moveFish(f) {
  // Lazy wandering
  f.heading += (Math.random() - 0.5) * 0.2;
  f.vx += Math.cos(f.heading) * 0.03;
  f.vy += Math.sin(f.heading) * 0.015;

  // Run away if the shark is close
  const dx = f.x - shark.x;
  const dy = f.y - shark.y;
  const d = Math.hypot(dx, dy) || 1;
  if (d < 220) {
    const push = (1 - d / 220) * 1.2;
    f.vx += (dx / d) * push;
    f.vy += (dy / d) * push;
  }

  // Speed limit and drag so they calm down afterwards
  const speed = Math.hypot(f.vx, f.vy);
  const max = d < 220 ? 7 : 1.5;
  if (speed > max) { f.vx *= max / speed; f.vy *= max / speed; }
  f.vx *= 0.97; f.vy *= 0.97;

  f.x += f.vx;
  f.y += f.vy;

  // Wrap sideways, bounce off top and bottom
  if (f.x < -40) f.x = canvas.width + 40;
  if (f.x > canvas.width + 40) f.x = -40;
  if (f.y < 30) { f.y = 30; f.vy = Math.abs(f.vy); }
  if (f.y > floorY() - 20) { f.y = floorY() - 20; f.vy = -Math.abs(f.vy); }
}

// Sea floor, seaweed, shipwreck and turtles
function floorY() { return canvas.height - Math.max(60, canvas.height * 0.12); }

const weeds = [];
for (let i = 0; i < 22; i++) {
  weeds.push({
    x: Math.random(),
    h: 40 + Math.random() * 70,
    phase: Math.random() * 6,
    color: ["#2e8b57", "#3cb371", "#1f6f4a"][i % 3]
  });
}

function drawSeaweed(w, t) {
  const baseX = w.x * canvas.width;
  const baseY = floorY() + 12;
  const segs = 6;
  ctx.strokeStyle = w.color;
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  for (let i = 1; i <= segs; i++) {
    const sway = Math.sin(t * 1.5 + w.phase + i * 0.6) * i * 3;
    ctx.lineTo(baseX + sway, baseY - (w.h / segs) * i);
  }
  ctx.stroke();
}

function drawWreck() {
  const x = canvas.width * 0.72;
  const y = floorY() + 14;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.12);
  // hull
  ctx.fillStyle = "#2b3440";
  ctx.beginPath();
  ctx.moveTo(-120, -35); ctx.lineTo(110, -40); ctx.lineTo(138, -64);
  ctx.lineTo(100, 0); ctx.lineTo(-110, 0);
  ctx.closePath(); ctx.fill();
  // red stripe near the waterline
  ctx.fillStyle = "#7a2a2a";
  ctx.fillRect(-118, -12, 214, 6);
  // upper deck
  ctx.fillStyle = "#3d4a58";
  ctx.fillRect(-85, -62, 160, 24);
  // four funnels
  for (let i = 0; i < 4; i++) {
    const fx = -60 + i * 38;
    ctx.fillStyle = "#6b4a2f";
    ctx.fillRect(fx, -104, 16, 44);
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(fx, -104, 16, 7);
  }
  // portholes
  ctx.fillStyle = "rgba(160, 220, 235, 0.7)";
  for (let i = 0; i < 12; i++) {
    ctx.beginPath();
    ctx.arc(-100 + i * 18, -24, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  // broken mast
  ctx.strokeStyle = "#2b3440";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(95, -45); ctx.lineTo(115, -95); ctx.stroke();
  ctx.restore();
}

function drawFloor() {
  const top = floorY();
  const sand = ctx.createLinearGradient(0, top, 0, canvas.height);
  sand.addColorStop(0, "#d9c28a");
  sand.addColorStop(1, "#8c7646");
  ctx.fillStyle = sand;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  for (let x = 0; x <= canvas.width; x += 20) {
    ctx.lineTo(x, top + Math.sin(x * 0.012) * 8 + Math.sin(x * 0.04) * 3);
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();
  ctx.fill();
}

const turtles = [];
for (let i = 0; i < 3; i++) {
  turtles.push({
    x: Math.random() * canvas.width,
    y: 100 + Math.random() * Math.max(50, floorY() - 250),
    vx: Math.random() < 0.5 ? -0.6 : 0.6,
    vy: 0,
    heading: Math.random() * 6,
    size: 0.9 + Math.random() * 0.4
  });
}

function moveTurtle(u) {
  // Slow lazy swimming; they pay no attention to the shark.
  u.heading += (Math.random() - 0.5) * 0.05;
  u.vy = Math.sin(u.heading) * 0.2;
  u.x += u.vx;
  u.y += u.vy;
  if (u.x < -60) u.x = canvas.width + 60;
  if (u.x > canvas.width + 60) u.x = -60;
  u.y = Math.max(60, Math.min(floorY() - 60, u.y));
}

function drawTurtle(u, t) {
  const dir = u.vx >= 0 ? 1 : -1;
  const paddle = Math.sin(t * 2 + u.heading) * 0.4;
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.scale(dir * u.size, u.size);

  // flippers
  ctx.fillStyle = "#7fb069";
  ctx.save(); ctx.translate(14, 10); ctx.rotate(0.5 + paddle);
  ctx.beginPath(); ctx.ellipse(8, 0, 14, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(-14, 10); ctx.rotate(2.6 - paddle);
  ctx.beginPath(); ctx.ellipse(8, 0, 12, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(14, -8); ctx.rotate(-0.5 - paddle);
  ctx.beginPath(); ctx.ellipse(8, 0, 14, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // tail and head
  ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-40, 3); ctx.lineTo(-30, 5); ctx.fill();
  ctx.beginPath(); ctx.arc(36, -2, 9, 0, Math.PI * 2); ctx.fill();
  // eye
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(40, -4, 1.8, 0, Math.PI * 2); ctx.fill();
  // shell
  ctx.fillStyle = "#6a8f3c";
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#3f5a22"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 20, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-14, -16); ctx.lineTo(-6, 0); ctx.lineTo(-14, 16);
  ctx.moveTo(14, -16); ctx.lineTo(6, 0); ctx.lineTo(14, 16);
  ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
  ctx.stroke();

  ctx.restore();
}

function frame() {
  const t = performance.now() / 1000;

  // Ocean background: bright at the surface, dark in the deep
  const sea = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sea.addColorStop(0, "#8be8ff");
  sea.addColorStop(0.25, "#35b6e8");
  sea.addColorStop(0.55, "#1672b0");
  sea.addColorStop(0.8, "#0a3d6b");
  sea.addColorStop(1, "#041d3a");
  ctx.fillStyle = sea;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawWreck();
  drawFloor();
  for (const w of weeds) drawSeaweed(w, t);
  for (const u of turtles) { moveTurtle(u); drawTurtle(u, t); }

  // Swim a little closer to the target each frame, turning to face it.
  const dx = target.x - shark.x;
  const dy = target.y - shark.y;
  if (Math.hypot(dx, dy) > 5) shark.angle = Math.atan2(dy, dx);
  shark.x += dx * 0.03;
  shark.y += dy * 0.03;

  // Release bubbles from the shark's mouth.
  if (Math.random() < 0.3) {
    const mx = shark.x + Math.cos(shark.angle) * 50;
    const my = shark.y + Math.sin(shark.angle) * 50;
    bubbles.push({
      x: mx + (Math.random() - 0.5) * 8,
      y: my,
      r: 2 + Math.random() * 5,
      life: 1,
      drift: Math.random() * Math.PI * 2
    });
  }

  // Bubbles float up and fade away.
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= 1 + b.r * 0.15;
    b.x += Math.sin(b.y * 0.05 + b.drift) * 0.5;
    b.life -= 0.008;
    if (b.life <= 0) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = "rgba(255,255,255," + b.life * 0.8 + ")";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (const f of fishes) { moveFish(f); drawFish(f); }
  drawShark();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
